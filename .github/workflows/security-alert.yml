name: Project Security Alert

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Load Configuration
      id: load_config
      run: |
        # Using python to parse YAML reliably
        ADMIN_EMAIL=$(python3 -c "import yaml; print(yaml.safe_load(open('config.yaml'))['email']['admin'])")
        APP_NAME=$(python3 -c "import yaml; print(yaml.safe_load(open('config.yaml'))['application']['name'])")
        echo "admin_email=$ADMIN_EMAIL" >> $GITHUB_OUTPUT
        echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT

    - name: Send Security Email
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USER }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "🚨 [${{ steps.load_config.outputs.app_name }}] Security Alert: ${{ github.event_name }} Detected"
        to: ${{ steps.load_config.outputs.admin_email }}
        from: ${{ steps.load_config.outputs.app_name }}
        html_body: |
          <div style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 600px; margin: auto; border: 1px solid #e0e0e0; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
            <div style="background: linear-gradient(135deg, #ff4b2b 0%, #ff416c 100%); color: white; padding: 25px; text-align: center;">
              <h1 style="margin: 0; font-size: 24px; letter-spacing: 1px;">Security Alert Detected</h1>
              <p style="margin: 5px 0 0 0; opacity: 0.9;">Action Required: Review Change Request</p>
            </div>
            <div style="padding: 30px; background-color: #ffffff; color: #333;">
              <p style="font-size: 16px;">Hello <strong>Admin</strong>,</p>
              <p style="color: #666; line-height: 1.6;">A security-sensitive event has been detected in your repository. Please review the details below:</p>
              
              <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
                <tr>
                  <td style="padding: 10px 0; border-bottom: 1px solid #eee; color: #888; width: 120px;">Event Type</td>
                  <td style="padding: 10px 0; border-bottom: 1px solid #eee; font-weight: 600;">${{ github.event_name }}</td>
                </tr>
                <tr>
                  <td style="padding: 10px 0; border-bottom: 1px solid #eee; color: #888;">Performed By</td>
                  <td style="padding: 10px 0; border-bottom: 1px solid #eee; font-weight: 600;">${{ github.actor }}</td>
                </tr>
                <tr>
                  <td style="padding: 10px 0; border-bottom: 1px solid #eee; color: #888;">Description</td>
                  <td style="padding: 10px 0; border-bottom: 1px solid #eee;">${{ github.event.pull_request.title || github.event.head_commit.message }}</td>
                </tr>
              </table>

              <div style="margin-top: 40px; text-align: center;">
                <a href="${{ github.event.pull_request.html_url || github.event.repository.html_url }}" 
                   style="background-color: #333; color: white; padding: 12px 30px; text-decoration: none; border-radius: 6px; font-weight: bold; display: inline-block;">
                   Review Changes
                </a>
              </div>
            </div>
            <div style="background-color: #f9f9f9; padding: 20px; text-align: center; font-size: 12px; color: #aaa;">
              Sent by <strong>${{ steps.load_config.outputs.app_name }}</strong> &bull; Automated Security Monitoring
            </div>
          </div>