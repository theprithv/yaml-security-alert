<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Alert Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="Logo" class="logo">
        
        <h1>YAML Security System</h1>

        <p>
            This system monitors our project files. If anyone makes changes, an automatic email alert is sent to the administrator.
        </p>

        <div class="status-box">
            Status: <span class="status-active">● System Active</span>
        </div>

        <button id="demo-btn">Check System Status</button>

        <footer>
            Monito Repository: yml-security-alert
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
